<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tucker Tracker — Reset Your Password</title>
<link rel="stylesheet" href="style.css">
<style>
form { margin-top: 20px; }
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
input[type="password"] {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
  font-size: 15px;
}
button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: var(--indigo);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}
button:disabled { opacity: 0.6; cursor: default; }
.message { padding: 14px 16px; border-radius: 10px; margin-top: 16px; font-size: 14px; }
.message.error { background: rgba(211, 47, 47, 0.12); color: #c62828; }
.message.success { background: rgba(31, 170, 106, 0.12); color: #1a8a5a; }
</style>
</head>
<body>
<div class="wrap">
<a class="badge" href="index.html">← Tucker Tracker legal pages</a>
<h1>Reset your password</h1>
<p id="intro">Enter a new password for your Tucker Tracker account below.</p>

<form id="reset-form">
  <label for="password">New password</label>
  <input type="password" id="password" minlength="8" required autocomplete="new-password">
  <label for="confirm">Confirm new password</label>
  <input type="password" id="confirm" minlength="8" required autocomplete="new-password">
  <button type="submit" id="submit-btn">Set new password</button>
</form>
<div id="result"></div>

<footer>Tucker Tracker is developed by xCalibre-AI.</footer>
</div>

<script>
// Each of the 3 Supabase projects this app talks to (dev/staging/
// prod, see docs/ENVIRONMENTS.md) -- keyed by project ref, the
// subdomain of its URL. The anon key is meant to be public/embeddable
// in client code (CLAUDE.md "Client-side code only ever holds public/
// anon keys"); access is enforced by RLS, not by keeping this secret.
// ?project=<ref> lets this one static page serve whichever project a
// given app build's reset request came from (SupabaseAuthRepository
// sets it from SupabaseConfig.projectRef).
const PROJECTS = {
  milkkgdxbzpodnjmnegp: {
    url: 'https://milkkgdxbzpodnjmnegp.supabase.co',
    anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pbGtrZ2R4Ynpwb2Ruam1uZWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTI2MzMsImV4cCI6MjEwNDE2ODYzM30.uIppbcrG2mKftEcyE9TyoTeDcqxHEI7a2unF3eggTDs',
  },
  dhhgynqzwwbezyiqabmd: {
    url: 'https://dhhgynqzwwbezyiqabmd.supabase.co',
    anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoaGd5bnF6d3diZXp5aXFhYm1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTI0MzQsImV4cCI6MjEwNDE2ODQzNH0.Lf6wuaJISjbTFlTPsjtHnO9HGDon8txC1v7Bzb_ta4s',
  },
  wvoaqsnuihemtosqxujq: {
    url: 'https://wvoaqsnuihemtosqxujq.supabase.co',
    anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2b2Fxc251aWhlbXRvc3F4dWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTAxMzcsImV4cCI6MjEwNDE2NjEzN30.IQV7FC_yX_Nhhq_qnjeHcRnaRh8Be2uMH__2dTzRGuk',
  },
};

const form = document.getElementById('reset-form');
const submitBtn = document.getElementById('submit-btn');
const resultEl = document.getElementById('result');
const introEl = document.getElementById('intro');

function showMessage(text, kind) {
  resultEl.innerHTML = '<div class="message ' + kind + '">' + text + '</div>';
}

function fail(text) {
  showMessage(text, 'error');
  form.style.display = 'none';
}

const params = new URLSearchParams(window.location.search);
const projectRef = params.get('project');
const project = projectRef ? PROJECTS[projectRef] : null;

// The emailed link's own redirect (Supabase's /auth/v1/verify step)
// appends the session as a URL fragment, e.g.
// #access_token=...&refresh_token=...&type=recovery -- not a query
// param, and not something a server ever sees (fragments never leave
// the browser), which is exactly why the token itself is safe here.
const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
const accessToken = hashParams.get('access_token');
const recoveryType = hashParams.get('type');

if (!project) {
  fail(
    "This link is missing information about which Tucker Tracker environment it's for. " +
    'Please request a new password reset from the app.',
  );
} else if (!accessToken || recoveryType !== 'recovery') {
  fail(
    "This link doesn't look like a valid password reset link, or it's expired. " +
    'Please request a new one from the app ("Forgot password?" on the sign-in screen).',
  );
} else {
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password.length < 8) {
      showMessage('Password must be at least 8 characters.', 'error');
      return;
    }
    if (password !== confirm) {
      showMessage("Passwords don't match.", 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Setting password…';
    resultEl.innerHTML = '';

    try {
      const response = await fetch(project.url + '/auth/v1/user', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          apikey: project.anonKey,
          Authorization: 'Bearer ' + accessToken,
        },
        body: JSON.stringify({ password }),
      });

      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.msg || body.error_description || 'Something went wrong. Please try again.');
      }

      form.style.display = 'none';
      introEl.style.display = 'none';
      showMessage('Your password has been changed. You can now sign in to Tucker Tracker with your new password.', 'success');
    } catch (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Set new password';
      showMessage(error.message, 'error');
    }
  });
}
</script>
</body>
</html>
